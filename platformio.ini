[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.memory_type = qio_opi

monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    ; ================= TFT_eSPI =================
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1

    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12

    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8

    -D SPI_FREQUENCY=40000000

    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1